<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DevTask</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================================
       Site Header
       ================================ -->

  <header class="site-header">

    <h1>DevTask</h1>

    <nav class="navigation">
      <a href="/">Dashboard</a>
      <a href="/tasks">Tasks</a>
      <a href="/settings">Settings</a>
    </nav>

  </header>


  <!-- ================================
       Dashboard
       ================================ -->

  <div class="dashboard">

    <!-- ================================
         Sidebar
         ================================ -->

    <aside class="sidebar">

      <nav class="sidebar-navigation">
        <a href="/">Dashboard</a>
        <a href="/tasks">Tasks</a>
        <a href="/completed">Completed</a>
        <a href="/settings">Settings</a>
      </nav>

    </aside>


    <!-- ================================
         Main Content
         ================================ -->

    <main class="content">

      <!-- ================================
           Active Tasks
           ================================ -->

      <section class="tasks">

        <header class="page-header">

          <h2>Active Tasks</h2>

          <p>
            Tasks you are currently working on.
          </p>

        </header>


        <!--
          JavaScript will dynamically render
          task cards inside this container.
        -->

        <div class="task-list"></div>

      </section>


      <!-- ================================
           Create Task Form
           ================================ -->

      <section class="task-form-section">

        <h2>Create a Task</h2>

        <form class="task-form">

          <!-- Task Title -->

          <div class="form-group">

            <label for="task-title">
              Task title
            </label>

            <input
              id="task-title"
              type="text"
              name="title"
              placeholder="Enter task title"
              minlength="3"
              required
            >

          </div>


          <!-- Task Description -->

          <div class="form-group">

            <label for="task-description">
              Description
            </label>

            <textarea
              id="task-description"
              name="description"
              placeholder="Describe the task"
            ></textarea>

          </div>


          <!-- Due Date -->

          <div class="form-group">

            <label for="task-due-date">
              Due date
            </label>

            <input
              id="task-due-date"
              type="date"
              name="dueDate"
            >

          </div>


          <!-- Submit -->

          <button type="submit">
            Create Task
          </button>

          <p
            class="form-message"
            aria-live="polite"
          ></p>

        </form>

      </section>

    </main>

  </div>


  <!-- ================================
       JavaScript
       ================================ -->

  <script
    type="module"
    src="./js/script.js"
  ></script>

</body>

</html>
