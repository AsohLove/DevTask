name: DevTask CI


on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest


    services:

      postgres:

        image: postgres:17

        env:

          POSTGRES_DB: devtask_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres


        ports:

          - 5432:5432


        options: >-
          --health-cmd="pg_isready -U postgres -d devtask_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5


    defaults:

      run:
        working-directory: backend


    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: 24

          cache: npm

          cache-dependency-path: backend/package-lock.json


      - name: Install dependencies

        run: npm ci


      - name: Run migrations

        env:

          DATABASE_URL: postgres://postgres:postgres@localhost:5432/devtask_test

        run: npm run migrate:up


      - name: Run tests

        env:

          NODE_ENV: test

          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: devtask_test
          DB_USER: postgres
          DB_PASSWORD: postgres

          JWT_SECRET: test-secret
          JWT_EXPIRES_IN: 1h

        run: npm test



  docker:

    needs: test

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Build Docker image

        run: |

          docker build \
            -t devtask-api \
            ./backend