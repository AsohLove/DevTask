<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DevTask</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <header class="site-header">

    <h1>DevTask</h1>

    <nav class="navigation">
      <a href="/">Dashboard</a>
      <a href="/tasks">Tasks</a>
      <a href="/settings">Settings</a>
    </nav>

  </header>

  <div class="dashboard">

    <aside class="sidebar">

      <nav class="sidebar-navigation">
        <a href="/">Dashboard</a>
        <a href="/tasks">Tasks</a>
        <a href="/completed">Completed</a>
        <a href="/settings">Settings</a>
      </nav>

    </aside>

    <main class="content">

      <section class="tasks">

        <header class="page-header">
          <h2>Active Tasks</h2>
          <p>Tasks you are currently working on.</p>
        </header>

        <div class="task-list">

          <article class="task-card">

            <h3>Learn HTML</h3>

            <p>
              Understand semantic HTML and accessibility.
            </p>

            <button type="button">
              Complete
            </button>

          </article>

          <article class="task-card">

            <h3>Learn CSS</h3>

            <p>
              Understand CSS layout and styling.
            </p>

            <button type="button">
              Complete
            </button>

          </article>

          <article class="task-card">

            <h3>Learn JavaScript</h3>

            <p>
              Understand JavaScript fundamentals.
            </p>

            <button type="button">
              Complete
            </button>

          </article>

        </div>

      </section>

    </main>

  </div>

</body>

</html>
